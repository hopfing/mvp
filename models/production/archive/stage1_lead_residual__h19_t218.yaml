calibration: null
data:
  date_range:
    end: 2025-12-31
    start: 2023-01-01
  eval_filters: {}
  filters:
    circuit:
    - tour
    - chal
    draw_type: singles
    player_lead_logit: not_null
  train_filters: {}
features:
  compute_only: []
  include:
  - opp_deciding_set_win_pct(days=30)
  - opp_tourn_holds
  - player_high_tier_match_pct(days=30)
  - player_lead_logit
  - player_matches_vs_net_rusher(days=730)
