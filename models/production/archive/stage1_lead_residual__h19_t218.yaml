    colsample_bylevel: 0.9854491383999707
    colsample_bynode: 0.7458561823500489
    colsample_bytree: 0.9051558893778467
    gamma: 1.496026139418448
    grow_policy: lossguide
    learning_rate: 0.017468530942137128
